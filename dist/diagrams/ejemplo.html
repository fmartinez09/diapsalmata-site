<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Example diagram</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8ebe1;color:#364a3a;font:13px system-ui,sans-serif}.diagram{min-height:280px;display:grid;place-content:center;justify-items:center;padding:30px;gap:18px}.diagram svg{width:min(100%,480px);height:auto}.diagram button{border:1px solid #899a82;background:transparent;color:#36513b;padding:8px 13px;cursor:pointer}.diagram button:focus-visible{outline:2px solid #294c92;outline-offset:3px}.link{stroke:#849883;stroke-width:1.5;transition:stroke .2s,stroke-width .2s}.active .link{stroke:#345d3d;stroke-width:3}.node{fill:#f8f8f0;stroke:#55785a;stroke-width:1.5}.label{fill:#405547;font:13px system-ui,sans-serif}@media(prefers-reduced-motion:reduce){.link{transition:none}}
</style></head><body><div class="diagram"><svg viewBox="0 0 480 160" role="img" aria-label="Three example nodes connected by lines"><line class="link" x1="100" y1="80" x2="240" y2="40"/><line class="link" x1="240" y1="40" x2="380" y2="100"/><circle class="node" cx="100" cy="80" r="22"/><circle class="node" cx="240" cy="40" r="22"/><circle class="node" cx="380" cy="100" r="22"/><text class="label" x="100" y="120" text-anchor="middle">A</text><text class="label" x="240" y="84" text-anchor="middle">B</text><text class="label" x="380" y="140" text-anchor="middle">C</text></svg><button type="button" aria-pressed="false">Highlight connections</button></div><script>const button=document.querySelector('button');button.addEventListener('click',()=>{const active=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(active));document.querySelector('.diagram').classList.toggle('active',active);button.textContent=active?'Reset':'Highlight connections';});</script></body></html>
